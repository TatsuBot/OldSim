<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OldSim Replay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: system-ui, sans-serif; color: #e6edf3; }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; text-shadow: 0 1px 3px #000;
    }
    #hud .panel {
      background: rgba(13,17,23,0.75); border: 1px solid #30363d;
      border-radius: 8px; padding: 10px 14px; pointer-events: auto;
    }
    #hud .counts { font-size: 18px; font-weight: 600; }
    #hud .counts .a { color: #58a6ff; }
    #hud .counts .b { color: #f85149; }
    #hud .timer { font-variant-numeric: tabular-nums; opacity: 0.9; }
    #controls {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      background: rgba(13,17,23,0.85); border: 1px solid #30363d;
      border-radius: 10px; padding: 8px 12px;
    }
    #controls button, #controls select {
      background: #21262d; color: #e6edf3; border: 1px solid #30363d;
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px;
    }
    #controls button:hover { background: #30363d; }
    #controls input[type=range] { width: 160px; }
    #status { font-size: 13px; opacity: 0.8; min-width: 120px; text-align: center; }
    #splats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .splat {
      position: absolute; transform: translate(-50%, -50%);
      font-weight: 700; font-size: 16px; text-shadow: 0 1px 2px #000;
      animation: splat-fade 0.8s ease-out forwards;
    }
    .splat.hit { color: #ff6b6b; }
    .splat.miss { color: #79c0ff; }
    @keyframes splat-fade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="splats"></div>
  <div id="hud">
    <div class="panel counts">
      <span class="a">A: <span id="countA">0</span></span>
      &nbsp;vs&nbsp;
      <span class="b">B: <span id="countB">0</span></span>
    </div>
    <div class="panel timer">Tick <span id="tick">0</span> / <span id="tickMax">0</span>
      &nbsp;·&nbsp; <span id="timeSec">0.0</span>s
    </div>
  </div>
  <div id="controls">
    <button id="btnPlay">Pause</button>
    <button id="btnReset">Reset</button>
    <label>Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
    <input type="range" id="scrub" min="0" max="0" value="0" />
    <span id="status">Loading…</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const TICK_SEC = 0.6; // OSRS tick length

    // --- load replay ---
    const statusEl = document.getElementById("status");
    let replay;
    try {
      const res = await fetch("./replay.json");
      if (!res.ok) throw new Error("replay.json not found — run: npx tsx src/runner/exportReplay.ts");
      replay = await res.json();
    } catch (e) {
      statusEl.textContent = String(e.message || e);
      throw e;
    }

    const frames = replay.frames;
    const arenaW = replay.config.arenaWidth;
    const arenaH = replay.config.arenaHeight;
    document.getElementById("tickMax").textContent = String(frames.length);

    // --- scene ---
    const wrap = document.getElementById("canvas-wrap");
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setClearColor(0x1a2332);
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
    // OSRS-ish angled top-down
    camera.position.set(arenaW / 2, Math.max(arenaW, arenaH) * 0.9, arenaH * 1.1);
    camera.lookAt(arenaW / 2, 0, arenaH / 2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(arenaW / 2, 0, arenaH / 2);
    controls.update();

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(30, 50, 20);
    scene.add(dir);

    // Ground grid
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d4a3e });
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(arenaW, arenaH),
      groundMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(arenaW / 2, 0, arenaH / 2);
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(Math.max(arenaW, arenaH), Math.max(arenaW, arenaH), 0x3d5a4e, 0x3d5a4e);
    gridHelper.position.set(arenaW / 2, 0.01, arenaH / 2);
    scene.add(gridHelper);

    // --- unit meshes ---
    const unitMeshes = new Map(); // id -> { group, body, hpBar, side }
    const COLOR_A = 0x58a6ff;
    const COLOR_B = 0xf85149;

    function makeUnit(u) {
      const size = Math.max(1, /* footprint approx from name later */ 1);
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.7 * size, 1.1 * size, 0.5 * size),
        new THREE.MeshLambertMaterial({ color: u.side === "A" ? COLOR_A : COLOR_B })
      );
      body.position.y = 0.55 * size;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.4 * size, 0.4 * size, 0.4 * size),
        new THREE.MeshLambertMaterial({ color: 0xf0e6d3 })
      );
      head.position.y = 1.3 * size;
      group.add(head);

      // HP bar (simple quad above head)
      const hpBg = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x333333 })
      );
      hpBg.position.y = 1.7 * size;
      group.add(hpBg);

      const hpFg = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x3fb950 })
      );
      hpFg.position.y = 1.7 * size;
      hpFg.position.z = 0.01;
      group.add(hpFg);

      scene.add(group);
      return { group, body, hpFg, hpBg, side: u.side, maxHp: u.maxHitpoints };
    }

    // Seed meshes from first frame
    if (frames.length > 0) {
      for (const u of frames[0].units) {
        unitMeshes.set(u.id, makeUnit(u));
      }
    }

    // --- playback state ---
    let playing = true;
    let speed = 1;
    let tickFloat = 0; // fractional tick for interpolation
    const scrub = document.getElementById("scrub");
    scrub.max = String(Math.max(0, frames.length - 1));

    document.getElementById("btnPlay").onclick = () => {
      playing = !playing;
      document.getElementById("btnPlay").textContent = playing ? "Pause" : "Play";
    };
    document.getElementById("btnReset").onclick = () => {
      tickFloat = 0;
      playing = true;
      document.getElementById("btnPlay").textContent = "Pause";
    };
    document.getElementById("speed").onchange = (e) => {
      speed = parseFloat(e.target.value);
    };
    scrub.oninput = () => {
      tickFloat = parseFloat(scrub.value);
      playing = false;
      document.getElementById("btnPlay").textContent = "Play";
    };

    const splatsEl = document.getElementById("splats");
    const shownSplatTicks = new Set();

    function worldToScreen(x, y, z) {
      const v = new THREE.Vector3(x, y, z);
      v.project(camera);
      return {
        x: (v.x * 0.5 + 0.5) * wrap.clientWidth,
        y: (-v.y * 0.5 + 0.5) * wrap.clientHeight,
      };
    }

    function spawnSplat(worldX, worldZ, damage, hit) {
      const s = worldToScreen(worldX, 1.2, worldZ);
      const el = document.createElement("div");
      el.className = "splat " + (hit && damage > 0 ? "hit" : "miss");
      el.textContent = hit && damage > 0 ? String(damage) : "0";
      el.style.left = s.x + "px";
      el.style.top = s.y + "px";
      splatsEl.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function applyFrame(i, alpha) {
      const i0 = Math.max(0, Math.min(frames.length - 1, Math.floor(i)));
      const i1 = Math.min(frames.length - 1, i0 + 1);
      const f0 = frames[i0];
      const f1 = frames[i1];
      const t = i0 === i1 ? 0 : alpha;

      const byId1 = new Map(f1.units.map((u) => [u.id, u]));
      let countA = 0, countB = 0;

      for (const u0 of f0.units) {
        let mesh = unitMeshes.get(u0.id);
        if (!mesh) {
          mesh = makeUnit(u0);
          unitMeshes.set(u0.id, mesh);
        }

        const u1 = byId1.get(u0.id) || u0;
        const x = u0.x + (u1.x - u0.x) * t + 0.5; // centre of tile
        const z = u0.y + (u1.y - u0.y) * t + 0.5;
        const alive = u0.hitpoints > 0 || (u1 && u1.hitpoints > 0);
        mesh.group.visible = u0.hitpoints > 0 || u1.hitpoints > 0;
        // Prefer showing the interpolated position while either frame has HP
        if (u0.hitpoints <= 0 && u1.hitpoints <= 0) {
          mesh.group.visible = false;
        } else {
          mesh.group.visible = true;
          mesh.group.position.set(x, 0, z);
          const hp = u1.hitpoints;
          const ratio = Math.max(0, hp / mesh.maxHp);
          mesh.hpFg.scale.x = Math.max(0.001, ratio);
          mesh.hpFg.position.x = -0.45 * (1 - ratio);
          mesh.hpFg.material.color.setHex(ratio > 0.5 ? 0x3fb950 : ratio > 0.25 ? 0xd29922 : 0xf85149);
        }

        if (u1.hitpoints > 0) {
          if (u1.side === "A") countA++;
          else countB++;
        }
      }

      document.getElementById("countA").textContent = String(countA);
      document.getElementById("countB").textContent = String(countB);
      document.getElementById("tick").textContent = String(i0);
      document.getElementById("timeSec").textContent = (i0 * TICK_SEC).toFixed(1);
      scrub.value = String(i0);

      // Damage splats for this tick (once)
      if (!shownSplatTicks.has(i0) && f0.events) {
        shownSplatTicks.add(i0);
        for (const ev of f0.events) {
          if (ev.type === "attack") {
            const def = f0.units.find((u) => u.id === ev.defenderId);
            if (def) spawnSplat(def.x + 0.5, def.y + 0.5, ev.damage, ev.hit);
          }
        }
      }

      statusEl.textContent = playing ? "Playing" : "Paused";
    }

    // --- loop ---
    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      if (playing && frames.length > 1) {
        tickFloat += (dt * speed) / TICK_SEC;
        if (tickFloat >= frames.length - 1) {
          tickFloat = frames.length - 1;
          playing = false;
          document.getElementById("btnPlay").textContent = "Play";
        }
      }
      const i0 = Math.floor(tickFloat);
      const alpha = tickFloat - i0;
      applyFrame(i0, alpha);

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener("resize", () => {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });
  </script>
</body>
</html>
